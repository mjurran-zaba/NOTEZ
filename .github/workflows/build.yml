name: Build NOTEZ

# Model branching NOTEZ:
#   - main          = release (releasable, tidak ada debug-only change)
#   - ZAQIxNOTEZ     = integrasi (semua PR dan merge masuk sini)
#   - fix/*, feat/*  = pekerjaan per isu, PR ke ZAQIxNOTEZ
# Push ke ZAQIxNOTEZ juga memicu build agar integrasi terus teruji.
on:
  push:
    branches: [main, ZAQIxNOTEZ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Action pin SHA (supply-chain): tag mutable diganti commit hash
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"

      - name: Install platform + build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          gradle-version: 8.5

      # Unit test dijalankan SEBELUM build: guard yang tidak dieksekusi CI
      # bukan guard, dan build hijau tidak membuktikan test di folder
      # app/src/test pernah berjalan.
      - name: Run unit tests + build debug APK
        run: gradle testDebugUnitTest assembleDebug --console=plain

      # Artifact debug hanya diproduksi dari main (release-intended).
      # Integrasi/PR cukup bukti compile + test.
      - name: Upload APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notez-debug
          path: app/build/outputs/apk/debug/app-debug.apk

